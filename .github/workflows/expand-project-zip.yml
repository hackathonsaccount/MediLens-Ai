name: Expand project ZIP into repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract project files
        run: |
          set -euo pipefail
          mkdir -p /tmp/medilens
          unzip -q MediLens-AI-GitHub-Ready.zip -d /tmp/medilens
          rsync -a --exclude='.git' /tmp/medilens/MediLens-AI/ ./
          rm -f MediLens-AI-GitHub-Ready.zip
          rm -rf /tmp/medilens

      - name: Commit extracted project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Add MediLens AI project source files"
          git push
